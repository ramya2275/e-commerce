apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  namespace: microservices-demo
  labels:
    app: gateway-service
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway-service
  template:
    metadata:
      labels:
        app: gateway-service
        tier: frontend
    spec:
      containers:
      - name: gateway-api
        image: microservices/api-gateway:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
          name: http
        env:
        - name: ASPNETCORE_ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: microservices-config
              key: ASPNETCORE_ENVIRONMENT
        - name: ASPNETCORE_URLS
          value: "http://+:5000"
        - name: ReverseProxy__Clusters__product-cluster__Destinations__destination1__Address
          value: "http://product-service.microservices-demo.svc.cluster.local:8080"
        - name: ReverseProxy__Clusters__order-cluster__Destinations__destination1__Address
          value: "http://order-service.microservices-demo.svc.cluster.local:8081"
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /health/live
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: microservices-demo
  labels:
    app: gateway-service
spec:
  type: NodePort
  ports:
  - port: 5000
    targetPort: 5000
    nodePort: 30500
    protocol: TCP
    name: http
  selector:
    app: gateway-service
